<!DOCTYPE html>
<html>
<head>
    <title>Nested Frames Demo</title>
</head>
<frameset rows="30%,70%">
    <!-- Top frame -->
    <frame src="header.html" name="topFrame">

    <!-- Nested frameset for bottom part -->
    <frameset cols="30%,70%">
        <frame src="menu.html" name="leftFrame">
        <frame src="content.html" name="rightFrame">
    </frameset>
</frameset>
</html>
