<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms Demo</title>
</head>
<body>

    <h2>Complete Form Example</h2>

    <!-- Form element -->
    <form action="submit.php" method="post" enctype="multipart/form-data" target="_blank" autocomplete="on" novalidate>
        
        <!-- Text input -->
        <p>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required maxlength="20" minlength="5">
        </p>

        <!-- Password input -->
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </p>

        <!-- Email input -->
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com">
        </p>

        <!-- Number input -->
        <p>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="60" step="1">
        </p>

        <!-- Date input -->
        <p>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </p>

        <!-- Radio buttons -->
        <p>Gender:
            <input type="radio" id="male" name="gender" value="male" checked>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </p>

        <!-- Checkbox -->
        <p>Interests:
            <input type="checkbox" id="sports" name="interest" value="sports">
            <label for="sports">Sports</label>
            <input type="checkbox" id="music" name="interest" value="music">
            <label for="music">Music</label>
        </p>

        <!-- Select dropdown -->
        <p>
            <label for="course">Course:</label>
            <select id="course" name="course" multiple size="3">
                <option value="cse">CSE</option>
                <option value="ece">ECE</option>
                <option value="aiml" selected>AIML</option>
            </select>
        </p>

        <!-- Textarea -->
        <p>
            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" rows="4" cols="40" placeholder="Write your feedback here..."></textarea>
        </p>

        <!-- File upload -->
        <p>
            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        </p>

        <!-- Hidden field -->
        <input type="hidden" name="form_id" value="12345">

        <!-- Buttons -->
        <p>
            <input type="submit" value="Submit Form">
            <input type="reset" value="Reset Form">
            <button type="button" onclick="alert('Button clicked!')">Click Me</button>
        </p>

    </form>

</body>
</html>
