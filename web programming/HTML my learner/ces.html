<!DOCTYPE html>
<html>
<head>
    <title>Character Escape Sequences Demo</title>
</head>
<body>

    <h2>Escape Sequences in HTML</h2>

    <p>Display tags literally: &lt;b&gt;Bold&lt;/b&gt;</p>
    <p>Use ampersand: Fish &amp; Chips</p>
    <p>Quotes: &quot;Hello World&quot; &apos;Single Quote&apos;</p>
    <p>Non-breaking space: Hello&nbsp;World</p>
    <p>Symbols: &copy; 2025, &reg; Brand, &trade; Trademark</p>
    <p>Currencies: &euro; 100, &pound; 50, &yen; 200, &cent; 25, &#8377; 30, &dollar; 4</p>
    <p>Degree: 90&deg; angle</p>
    <p>Ellipsis: Wait&hellip;</p>
    <p>Arrow: Next&rarr;</p>

</body>
</html>
