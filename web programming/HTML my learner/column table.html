<!DOCTYPE html>
<html>
<head>
    <title>Table Column Demo</title>
</head>
<body>

    <h2>Table with Column Styling</h2>

    <table border="1">
        <!-- Define column groups -->
        <colgroup>
            <col span="1" style="background-color:lightblue">
            <col span="1" style="background-color:lightgreen">
            <col span="1" style="background-color:lightyellow">
        </colgroup>

        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Prasheel</td>
            <td>90</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Anita</td>
            <td>85</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Rahul</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
