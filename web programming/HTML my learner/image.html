<!DOCTYPE html>
<html>
<head>
    <title>Image Tag Demo</title>
</head>
<body>

    <h2>Demonstration of &lt;img&gt; Tag Attributes</h2>

    <!-- Basic image -->
    <p>Basic image:</p>
    <img src="sample.jpg" alt="Sample image">

    <!-- Width and Height -->
    <p>Image with width and height attributes:</p>
    <img src="sample.jpg" alt="Resized sample image" width="200" height="150">

    <!-- Title (tooltip on hover) -->
    <p>Image with title attribute:</p>
    <img src="sample.jpg" alt="Sample image with tooltip" title="This is a tooltip text">

    <!-- Border (deprecated, but still works in some browsers) -->
    <p>Image with border attribute:</p>
    <img src="sample.jpg" alt="Sample image with border" width="200" height="150" border="2">

    <!-- Align (deprecated, but shows alignment) -->
    <p>Image aligned to the right:</p>
    <img src="sample.jpg" alt="Right aligned image" width="150" height="100" align="right">
    <p>This text flows around the image.</p>

    <!-- Use of style for modern CSS control -->
    <p>Image styled with CSS:</p>
    <img src="sample.jpg" alt="Styled image" style="border: 3px solid red; border-radius: 10px;">

    <!-- Longdesc (URL to a detailed description, rarely used today) -->
    <p>Image with longdesc attribute:</p>
    <img src="sample.jpg" alt="Image with long description" longdesc="description.html">

</body>
</html>
