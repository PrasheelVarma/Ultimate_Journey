<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Demo</title>
</head>
<body>

    <h2 align="Right"> Basic Table</h2>
    <table border="1" align="right">
        <tr>
            <th>Sl. No</th>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Prasheel</td>
            <td>20</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Ravi</td>
            <td>22</td>
        </tr>
    </table>

    <h2>Table with Attributes</h2>
    <table border="2" cellpadding="10" cellspacing="5" width="60%" align="center">
        <caption>Student Information</caption>
        <tr bgcolor="lightgray">
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Anita</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Rahul</td>
            <td>ECE</td>
        </tr>
    </table>

    <h2>Table with Rowspan and Colspan</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr>
            <th>Math</th>
            <th>Science</th> 
        </tr>
        <tr>
            <td>Priya</td>
            <td>85</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Arjun</td>
            <td>78</td>
            <td>88</td>
        </tr>
    </table>
	<br/>
	<br/>
	<table border="1">
	<tr>
		<th>abaraca</th>
		<th>dhabra</th>
	</tr>
	

</body>
</html>
