<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JDBC Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-8">

    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Simulated Database App</h1>
        <p class="text-sm text-gray-600 mb-4 text-center">
            This demonstrates a simple web form that would send data to a backend.
        </p>

        <!-- Form to add a new item -->
        <form id="dataForm" class="flex flex-col space-y-4">
            <input type="text" id="itemName" placeholder="Item Name" required class="p-2 border rounded">
            <input type="number" id="itemValue" placeholder="Item Value" required class="p-2 border rounded">
            <button type="submit" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
                Add Item
            </button>
        </form>

        <div id="message" class="mt-4 text-center font-medium"></div>

        <!-- Simulated display of database items -->
        <ul id="dataList" class="mt-6 space-y-2">
            <!-- Items would be loaded here -->
        </ul>
    </div>

    <script>
        // A simple array to act as our "database"
        let mockDatabase = [
            { name: 'Pen', value: 1.50 },
            { name: 'Notebook', value: 4.00 }
        ];

        const dataForm = document.getElementById('dataForm');
        const dataList = document.getElementById('dataList');
        const messageDiv = document.getElementById('message');

        // Function to render the list of items
        function renderItems() {
            dataList.innerHTML = ''; // Clear the list
            mockDatabase.forEach(item => {
                const li = document.createElement('li');
                li.className = "bg-gray-100 p-2 rounded flex justify-between";
                li.textContent = `${item.name}: $${item.value.toFixed(2)}`;
                dataList.appendChild(li);
            });
        }

        // Handle form submission
        dataForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const itemName = document.getElementById('itemName').value;
            const itemValue = parseFloat(document.getElementById('itemValue').value);

            // In a real app, this is where the fetch() call would go to send data to the server.
            // The server would then use JDBC to insert this data into the MySQL database.

            messageDiv.textContent = 'Adding item...';

            // Simulate the server-side process
            setTimeout(() => {
                mockDatabase.push({ name: itemName, value: itemValue });
                messageDiv.textContent = 'Item added successfully!';
                renderItems();
                dataForm.reset();
            }, 500);
        });

        // Initial render
        renderItems();
    </script>
</body>
</html>
