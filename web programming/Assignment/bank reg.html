<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bank Registration</title>
</head>
<body>

    <h2>Bank Account Registration</h2>
    <p>Please fill in your details to create an account.</p>

    <!-- The form tag starts here -->
    <form action="#" method="POST">

        <!-- Text Input for Full Name -->
        <div>
            <label for="full-name">Full Name:</label><br>
            <input type="text" id="full-name" name="fullName">
        </div>
        <br>

        <!-- Email Input -->
        <div>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email">
        </div>
        <br>

        <!-- Radio Buttons for Gender -->
        <div>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <br>

        <!-- Dropdown (Select) for Account Type -->
        <div>
            <label for="account-type">Choose Account Type:</label><br>
            <select id="account-type" name="accountType">
                <option value="savings">Savings Account</option>
                <option value="current">Current Account</option>
            </select>
        </div>
        <br>

        <!-- Textarea for Address -->
        <div>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="3" cols="30"></textarea>
        </div>
        <br>

        <!-- Checkbox for Terms and Conditions -->
        <div>
            <input type="checkbox" id="terms" name="terms">
            <label for="terms">I agree to the terms and conditions</label>
        </div>
        <br>

        <!-- Submit and Reset Buttons -->
        <div>
            <button type="submit">Create Account</button>
            <button type="reset">Clear Form</button>
        </div>

    </form>

</body>
</html>
