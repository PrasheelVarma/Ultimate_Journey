<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open a New Bank Account</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="form_styles.css">
</head>
<body>

    <div class="form-container">
        <header>
            <h1>Bank Account Registration</h1>
            <p>Please fill out the form below to open your new account.</p>
        </header>
        
        <form action="#" method="POST">
            
            <fieldset>
                <legend>Personal Information</legend>
                
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dateOfBirth" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
                        <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
                        <label for="other"><input type="radio" id="other" name="gender" value="other"> Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Mailing Address</label>
                    <textarea id="address" name="address" rows="4" placeholder="Enter your complete address" required></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Contact & Account Details</legend>

                 <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>
                
                <div class="form-group">
                    <label for="account-type">Account Type</label>
                    <select id="account-type" name="accountType">
                        <option value="">--Please choose an option--</option>
                        <option value="savings">Savings Account</option>
                        <option value="current">Current Account</option>
                        <option value="joint">Joint Account</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="initial-deposit">Initial Deposit Amount: <span id="deposit-value">$500</span></label>
                    <input type="range" id="initial-deposit" name="initialDeposit" min="100" max="5000" value="500" step="50" oninput="document.getElementById('deposit-value').textContent = '$' + this.value;">
                </div>

                 <div class="form-group">
                    <label for="profile-picture">Upload Profile Picture</label>
                    <input type="file" id="profile-picture" name="profilePicture" accept="image/png, image/jpeg">
                </div>
            </fieldset>

            <fieldset>
                <legend>Confirmation</legend>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</label>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit" class="btn-submit">Register Account</button>
                <button type="reset" class="btn-reset">Clear Form</button>
            </div>
            
        </form>
    </div>

</body>
</html>
