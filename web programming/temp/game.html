<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Asteroids</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-white: #ffffff;
            --dark-background: #0d0d1a;
            --glow-cyan: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
            --glow-magenta: 0 0 5px var(--neon-magenta), 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--dark-background);
            color: var(--neon-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .game-container {
            border: 2px solid var(--neon-cyan);
            box-shadow: var(--glow-cyan);
            border-radius: 15px;
            padding: 1rem;
            background-color: rgba(13, 13, 26, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            margin-bottom: 0.5rem;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding: 0 1rem;
        }

        #score, #level {
            color: var(--neon-magenta);
            text-shadow: var(--glow-magenta);
        }

        #lives {
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
        }

        canvas {
            background-color: #000;
            display: block;
            border-radius: 10px;
        }
        
        .instructions {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--neon-white);
            opacity: 0.8;
            max-width: 600px;
        }
        
        .instructions span {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 4px;
        }

        #gameOverModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
        }

        #gameOverModal.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: var(--dark-background);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--neon-magenta);
            box-shadow: var(--glow-magenta);
        }
        
        .modal-content h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--neon-magenta);
        }
        
        .modal-content p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--neon-white);
        }

        #restartButton {
            font-family: 'Orbitron', sans-serif;
            background-color: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: var(--glow-cyan);
        }

        #restartButton:hover {
            background-color: var(--neon-cyan);
            color: var(--dark-background);
            box-shadow: 0 0 30px var(--neon-cyan), 0 0 50px var(--neon-cyan);
        }

    </style>
</head>
<body>

    <div class="game-container">
        <h1>NEON ASTEROIDS</h1>
        <div class="hud">
            <div id="score">SCORE: 0</div>
            <div id="level">LEVEL: 1</div>
            <div id="lives"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="instructions">
        Use <span>&uarr;</span> to thrust, <span>&larr;</span> and <span>&rarr;</span> to turn, and <span>SPACE</span> to shoot.
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p id="finalScore">Your Score: 0</p>
            <button id="restartButton">RESTART</button>
        </div>
    </div>


    <script>
        // --- Basic Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const livesEl = document.getElementById('lives');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreEl = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');

        let canvasWidth = 800;
        let canvasHeight = 600;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // --- Game Constants ---
        const SHIP_SIZE = 30;
        const SHIP_THRUST = 0.1;
        const SHIP_TURN_SPEED = 0.1;
        const SHIP_LIVES = 3;
        const FRICTION = 0.99;
        const BULLET_SPEED = 7;
        const BULLET_MAX = 10;
        const ASTEROID_NUM_START = 3;
        const ASTEROID_SPEED = 1;
        const ASTEROID_SIZE_LARGE = 100;
        const ASTEROID_SIZE_MEDIUM = 50;
        const ASTEROID_SIZE_SMALL = 25;
        const ASTEROID_POINTS_LARGE = 20;
        const ASTEROID_POINTS_MEDIUM = 50;
        const ASTEROID_POINTS_SMALL = 100;
        const SHIP_INVINCIBILITY_DUR = 3; // seconds
        const SHIP_BLINK_DUR = 0.2; // seconds

        // --- Game State ---
        let ship;
        let asteroids;
        let bullets;
        let score;
        let level;
        let lives;
        let keys = {
            up: false,
            left: false,
            right: false,
            space: false
        };
        let gameRunning = true;

        // --- Utility Functions ---
        function degToRad(d) {
            return d * Math.PI / 180;
        }
        
        function distBetweenPoints(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }
        
        // --- Classes ---
        class Ship {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.r = SHIP_SIZE / 2;
                this.a = degToRad(270); // Angle
                this.rot = 0; // Rotation
                this.thrusting = false;
                this.thrust = { x: 0, y: 0 };
                this.blinkTime = SHIP_INVINCIBILITY_DUR * 60; // Frames
                this.blinkOn = true;
            }

            draw() {
                if (!this.blinkOn) return;
                
                ctx.strokeStyle = '#00ffff'; // Use direct hex color
                ctx.lineWidth = SHIP_SIZE / 15;
                ctx.shadowColor = '#00ffff'; // Use direct hex color
                ctx.shadowBlur = 15;
                
                ctx.beginPath();
                ctx.moveTo( // Nose of the ship
                    this.x + this.r * Math.cos(this.a),
                    this.y - this.r * Math.sin(this.a)
                );
                ctx.lineTo( // Rear left
                    this.x - this.r * (Math.cos(this.a) + Math.sin(this.a)),
                    this.y + this.r * (Math.sin(this.a) - Math.cos(this.a))
                );
                ctx.lineTo( // Rear right
                    this.x - this.r * (Math.cos(this.a) - Math.sin(this.a)),
                    this.y + this.r * (Math.sin(this.a) + Math.cos(this.a))
                );
                ctx.closePath();
                ctx.stroke();
                
                // Draw thrust flame
                if(this.thrusting && this.blinkOn) {
                    ctx.fillStyle = '#ff00ff'; // Use direct hex color
                    ctx.strokeStyle = '#ffffff'; // Use direct hex color
                    ctx.lineWidth = SHIP_SIZE / 20;
                    ctx.shadowColor = '#ff00ff'; // Use direct hex color
                    ctx.shadowBlur = 20;

                    ctx.beginPath();
                     ctx.moveTo( // Rear center
                        this.x - this.r * 0.8 * (Math.cos(this.a) - 0.5 * Math.sin(this.a)),
                        this.y + this.r * 0.8 * (Math.sin(this.a) + 0.5 * Math.cos(this.a))
                    );
                     ctx.lineTo( // Flame tip
                        this.x - this.r * 1.5 * Math.cos(this.a),
                        this.y + this.r * 1.5 * Math.sin(this.a)
                    );
                    ctx.lineTo( // Rear center
                        this.x - this.r * 0.8 * (Math.cos(this.a) + 0.5 * Math.sin(this.a)),
                        this.y + this.r * 0.8 * (Math.sin(this.a) - 0.5 * Math.cos(this.a))
                    );
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }

            update() {
                this.a += this.rot;

                if (this.thrusting) {
                    this.thrust.x += SHIP_THRUST * Math.cos(this.a);
                    this.thrust.y -= SHIP_THRUST * Math.sin(this.a);
                } else {
                    this.thrust.x *= FRICTION;
                    this.thrust.y *= FRICTION;
                }
                
                this.x += this.thrust.x;
                this.y += this.thrust.y;
                
                // Handle screen wrap
                if (this.x < 0 - this.r) this.x = canvas.width + this.r;
                if (this.x > canvas.width + this.r) this.x = 0 - this.r;
                if (this.y < 0 - this.r) this.y = canvas.height + this.r;
                if (this.y > canvas.height + this.r) this.y = 0 - this.r;

                // Blinking
                if (this.blinkTime > 0) {
                    this.blinkTime--;
                    this.blinkOn = Math.floor(this.blinkTime / (SHIP_BLINK_DUR * 60)) % 2 == 0;
                } else {
                    this.blinkOn = true;
                }

                this.draw();
            }
        }
        
        class Bullet {
            constructor(ship) {
                this.x = ship.x + ship.r * Math.cos(ship.a);
                this.y = ship.y - ship.r * Math.sin(ship.a);
                this.xv = BULLET_SPEED * Math.cos(ship.a) + ship.thrust.x;
                this.yv = -BULLET_SPEED * Math.sin(ship.a) + ship.thrust.y;
                this.r = 3;
            }

            draw() {
                ctx.fillStyle = '#ff00ff'; // Use direct hex color
                ctx.shadowColor = '#ff00ff'; // Use direct hex color
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2, false);
                ctx.fill();
            }
            
            update() {
                this.x += this.xv;
                this.y += this.yv;
                this.draw();
            }
        }
        
        class Asteroid {
            constructor(x, y, r) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.r = r || ASTEROID_SIZE_LARGE / 2;
                let angle = Math.random() * Math.PI * 2;
                this.xv = Math.random() * ASTEROID_SPEED * (Math.random() < 0.5 ? 1 : -1);
                this.yv = Math.random() * ASTEROID_SPEED * (Math.random() < 0.5 ? 1 : -1);
            }
            
            draw() {
                ctx.strokeStyle = '#ffffff'; // Use direct hex color
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ffffff'; // Use direct hex color
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2, false);
                ctx.stroke();
            }

            update() {
                this.x += this.xv;
                this.y += this.yv;

                // Handle screen wrap
                if (this.x < 0 - this.r) this.x = canvas.width + this.r;
                if (this.x > canvas.width + this.r) this.x = 0 - this.r;
                if (this.y < 0 - this.r) this.y = canvas.height + this.r;
                if (this.y > canvas.height + this.r) this.y = 0 - this.r;

                this.draw();
            }
        }
        
        // --- Game Functions ---
        
        function createAsteroidBelt() {
            asteroids = [];
            let numAsteroids = ASTEROID_NUM_START + level;
            for(let i = 0; i < numAsteroids; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (distBetweenPoints(ship.x, ship.y, x, y) < ASTEROID_SIZE_LARGE * 2 + ship.r);
                asteroids.push(new Asteroid(x, y, ASTEROID_SIZE_LARGE / 2));
            }
        }

        function destroyAsteroid(index) {
            let ast = asteroids[index];
            if(ast.r === ASTEROID_SIZE_LARGE / 2) {
                asteroids.push(new Asteroid(ast.x, ast.y, ASTEROID_SIZE_MEDIUM / 2));
                asteroids.push(new Asteroid(ast.x, ast.y, ASTEROID_SIZE_MEDIUM / 2));
                score += ASTEROID_POINTS_LARGE;
            } else if (ast.r === ASTEROID_SIZE_MEDIUM / 2) {
                asteroids.push(new Asteroid(ast.x, ast.y, ASTEROID_SIZE_SMALL / 2));
                asteroids.push(new Asteroid(ast.x, ast.y, ASTEROID_SIZE_SMALL / 2));
                score += ASTEROID_POINTS_MEDIUM;
            } else {
                score += ASTEROID_POINTS_SMALL;
            }
            asteroids.splice(index, 1);
            updateScore();
            
            // Check for level up
            if(asteroids.length === 0){
                level++;
                updateLevel();
                createAsteroidBelt();
            }
        }

        function handleCollisions() {
            // Asteroid collisions
            for (let i = asteroids.length - 1; i >= 0; i--) {
                // Ship collision
                if (ship.blinkTime === 0 && distBetweenPoints(ship.x, ship.y, asteroids[i].x, asteroids[i].y) < ship.r + asteroids[i].r) {
                    destroyAsteroid(i);
                    loseLife();
                    return;
                }
                
                // Bullet collision
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (distBetweenPoints(bullets[j].x, bullets[j].y, asteroids[i].x, asteroids[i].y) < asteroids[i].r) {
                        destroyAsteroid(i);
                        bullets.splice(j, 1);
                        break; // Stop checking this asteroid against other bullets
                    }
                }
            }
        }
        
        function updateScore() {
            scoreEl.textContent = `SCORE: ${score}`;
        }
        
        function updateLevel() {
            levelEl.textContent = `LEVEL: ${level}`;
        }
        
        function updateLives() {
            let livesHtml = 'LIVES: ';
            for (let i = 0; i < lives; i++) {
                livesHtml += '❤';
            }
            livesEl.innerHTML = livesHtml;
        }

        function loseLife() {
            lives--;
            updateLives();
            if (lives <= 0) {
                gameOver();
            } else {
                ship = new Ship();
            }
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.textContent = `Your Score: ${score}`;
            gameOverModal.classList.add('show');
        }

        function init() {
            ship = new Ship();
            bullets = [];
            score = 0;
            level = 1;
            lives = SHIP_LIVES;
            gameRunning = true;
            createAsteroidBelt();
            updateScore();
            updateLevel();
            updateLives();
            gameOverModal.classList.remove('show');
        }

        // --- Event Listeners ---
        function keyDown(e) {
            if(!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp': keys.up = true; ship.thrusting = true; break;
                case 'ArrowLeft': keys.left = true; ship.rot = -SHIP_TURN_SPEED; break;
                case 'ArrowRight': keys.right = true; ship.rot = SHIP_TURN_SPEED; break;
                case ' ': keys.space = true; break;
            }
        }

        function keyUp(e) {
            if(!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp': keys.up = false; ship.thrusting = false; break;
                case 'ArrowLeft': keys.left = false; if(!keys.right) ship.rot = 0; break;
                case 'ArrowRight': keys.right = false; if(!keys.left) ship.rot = 0; break;
                case ' ': 
                    keys.space = false;
                    if(bullets.length < BULLET_MAX) {
                        bullets.push(new Bullet(ship));
                    }
                    break;
            }
        }
        
        document.addEventListener('keydown', keyDown);
        document.addEventListener('keyup', keyUp);
        restartButton.addEventListener('click', () => {
            init();
            gameLoop();
        });


        // --- Game Loop ---
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // Trail effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Reset shadows for next frame
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            // Update and draw everything
            ship.update();

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                // Remove off-screen bullets
                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            asteroids.forEach(ast => ast.update());

            handleCollisions();
            
            requestAnimationFrame(gameLoop);
        }

        // --- Start Game ---
        init();
        gameLoop();
    </script>
</body>
</html>
