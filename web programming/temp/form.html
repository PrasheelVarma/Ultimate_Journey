<html>
<head>
<title>Registration Form</title>
</head>
<body bgcolor="#80C0E2">
<form name="frm1">
<center>
<h2>Registration Form</h2>
<table align="center" border="1">
<tr>
<td>Student NO:</td>
<td><input type="text" name="sno"></td>
</tr>
<tr>
<td>Name:</td>
<td><input type="text" name="name"></td>
</tr>

<tr>
  <td>Gender:</td>
  <td>
    <input type="radio" name="gen">Male</input>
    &nbsp
    <input type="radio" name="gen">Female</input>
  </td>
</tr>

<tr>
  <td>password:</td>
  <td><input type="password" name="pwd"></td>
</tr>

<tr>
  <td>Branch:</td>
  <td>
    <select name="branch">
      <option>--SELECT--</option>
      <option>CSE</option>
      <option>ECE</option>
      <option>MECH</option>
    </select>
  </td>
</tr>

<tr>
  <td>Hobbies</td>
  <td>
    <input type="checkbox" name="hb">Playing cricket</input>&nbsp
    <input type="checkbox" name="hb">
    Reading books</input>
  </td>
</tr>

<tr>
<td> Address:</td>
<td><textarea name="addrs" rows=4 cols=15>
</textarea></td>
</tr>

<td><input type="submit" name="subm" value="Submit">
</input></td><td>
<input type="reset" name="rs" value="Reset">
</td></tr>
</table>
</center>
</form>
</body>
</html>
